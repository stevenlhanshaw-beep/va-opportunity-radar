name: Refresh VA Opportunity Radar

on:
  workflow_dispatch:
  schedule:
    - cron: "17 10 * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh eVA spend signals
        run: python fetch_eva.py

      - name: Refresh open opportunities
        run: python fetch_opportunities.py

      - name: Save refreshed data
        run: |
          git config user.name "va-opportunity-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/signals.json data/opportunities.json
          git diff --cached --quiet || git commit -m "Refresh VA Opportunity Radar data"
          git push
