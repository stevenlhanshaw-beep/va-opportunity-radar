name: Refresh eVA data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 10 * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh eVA spend signals
        run: python fetch_eva.py

      - name: Save refreshed data
        run: |
          git config user.name "va-opportunity-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/signals.json
          git diff --cached --quiet || git commit -m "Refresh eVA spend signals"
          git push
